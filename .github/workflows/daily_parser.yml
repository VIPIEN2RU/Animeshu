name: Ежедневный парсинг AniLiberty → MAX

on:
  schedule:
    # Каждый день в 00:00 UTC (3:00 МСК)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Ручной запуск

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: 🔧 Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Установка зависимостей
        run: npm ci
      
      - name: 🎬 Установка ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - name: 🏗️ Сборка TypeScript
        run: npm run build
      
      - name: 🔑 Восстановление сессии MAX
        run: |
          if [ -n "${{ secrets.MAX_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.MAX_SESSION_BASE64 }}" | base64 -d > .max-session.json
            echo "✅ Сессия восстановлена из Base64"
          elif [ -n "${{ secrets.MAX_SESSION }}" ]; then
            echo "${{ secrets.MAX_SESSION }}" > .max-session.json
            echo "✅ Сессия восстановлена"
          else
            echo "⚠️ Сессия не найдена, будет выполнен интерактивный вход"
          fi
      
      - name: 🧹 Освобождение места на диске
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -f || true
      
      - name: 🚀 Запуск парсера
        run: npm start
        env:
          GITHUB_ACTIONS: true
          MAX_SESSION_BASE64: ${{ secrets.MAX_SESSION_BASE64 }}
          MAX_PHONE: ${{ secrets.MAX_PHONE }}
      
      - name: 💾 Сохранение данных
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .max-session.json downloaded_releases.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🔄 Обновление данных [skip ci]"
          git push
