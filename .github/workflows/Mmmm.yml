name: Создание package-lock.json

on:
  workflow_dispatch:  # Ручной запуск

permissions:
  contents: write

jobs:
  create-lockfile:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование
        uses: actions/checkout@v4
      
      - name: 🔧 Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 📦 Установка зависимостей и создание lockfile
        run: |
          npm install
          # Проверяем, что файл создался
          ls -la package-lock.json || echo "Файл не создан!"
      
      - name: 📤 Коммит package-lock.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "📦 Добавлен package-lock.json [skip ci]"
          git push
